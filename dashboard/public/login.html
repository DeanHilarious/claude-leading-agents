<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指挥台 · 登录</title>
<style>
/* 复用 public/styles.css 的设计令牌（夜间指挥台），独立内联，不引用外部资源 */
:root {
  --bg: #0B0C10;
  --surface: #13151B; --surface-2: #1A1D25;
  --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
  --text: #ECEDF1; --text-2: #9A9EAB; --text-3: #5E6270;
  --claude: #E8876A; --claude-soft: rgba(232,135,106,.12);
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  --shadow-pop: 0 24px 48px -12px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F7F7F9;
    --surface: #FFFFFF; --surface-2: #F1F2F5;
    --border: rgba(15,17,23,.08); --border-strong: rgba(15,17,23,.16);
    --text: #12131A; --text-2: #5B5F6B; --text-3: #9094A0;
    --claude: #D0623F; --claude-soft: rgba(208,98,63,.12);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 400 14px/22px var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card {
  width: 100%; max-width: 360px; padding: 36px 32px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.logo {
  width: 48px; height: 48px; border-radius: 12px; margin-bottom: 8px;
  background: var(--claude-soft); color: var(--claude);
  display: grid; place-items: center;
}
h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
.sub { margin: 0 0 16px; color: var(--text-2); font-size: 13px; }
input[type="password"] {
  width: 100%; height: 42px; padding: 0 12px; margin-bottom: 12px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 10px;
  font: inherit; outline: none;
  transition: border-color 160ms var(--ease);
}
input[type="password"]:focus { border-color: var(--claude); }
input[type="password"]::placeholder { color: var(--text-3); }
button {
  width: 100%; height: 42px; border: none; border-radius: 10px;
  background: var(--claude); color: #fff; font: 600 14px var(--font-body);
  cursor: pointer; transition: opacity 160ms var(--ease);
}
button:hover { opacity: .9; }
button:disabled { opacity: .5; cursor: wait; }
.err { margin: 12px 0 0; color: #F87171; font-size: 13px; text-align: center; }
@media (max-width: 420px) {
  .card { padding: 28px 20px; border-radius: 12px; }
}
</style>
</head>
<body>
<main class="wrap">
  <form class="card" id="f" method="post" action="/login">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2-7 4 14 2-7h6"/>
      </svg>
    </div>
    <h1>指挥台</h1>
    <p class="sub">输入观看密码进入</p>
    <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="密码" required autofocus>
    <button type="submit" id="btn">进入指挥台</button>
    <p class="err" id="err" hidden></p>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  err.hidden = true;
  btn.disabled = true;
  try {
    var r = await fetch('/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    if (r.ok) { location.href = '/'; return; }
    err.textContent = r.status === 429 ? '尝试过于频繁，请 10 分钟后再试' : '密码不正确，请检查后重试';
    err.hidden = false;
  } catch (e) {
    err.textContent = '网络异常，请稍后重试';
    err.hidden = false;
  }
  btn.disabled = false;
});
</script>
</body>
</html>
